etcd:
  endpoints: ["192.168.112.130:2379"]
  dialTimoutSeconds: 10
database:
  dsn: "root:root@tcp(192.168.112.130:3306)/tomato_mq_admin?charset=utf8mb4&parseTime=True&loc=Local"
  maxIdle: 2
  maxOpen: 10
  connMaxMinutes: 10
log:
  writers:
    - id: app-default
      type: STDOUT
      level: INFO
    - id: etcd-biz
      type: STDOUT
      level: INFO
    - id: dal-biz
      type: STDOUT
      level: INFO
    - id: common-error
      type: STDERR
      level: ERROR
  loggers:
    - name: app-logger
      writers: ["app-default", "common-error"]
    - name: etcd-logger
      writers: ["etcd-biz", "common-error"]
    - name: dal-logger
      writers: ["dal-biz", "common-error"]
  defaultLoggerName: app-logger
