server:
  group: test
  brokerName: test_local-broker
  port: 6777
etcd:
  endpoints: ["localhost:2379"]
  dialTimoutSeconds: 10
log:
  writers:
    - id: app-default
      type: STDOUT
      level: INFO
    - id: etcd-biz
      type: STDOUT
      level: INFO
    - id: server-biz
      type: STDOUT
      level: INFO
    - id: common-error
      type: STDERR
      level: ERROR
  loggers:
    - name: app-logger
      writers: ["app-default", "common-error"]
    - name: etcd-logger
      writers: ["etcd-biz", "common-error"]
    - name: server-logger
      writers: ["server-biz", "common-error"]
  defaultLoggerName: app-logger
